[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionos-sre"
version = "0.1.0"
description = "Auditable metrics-only microservice diagnosis MVP"
requires-python = ">=3.11"
dependencies = ["torch==2.7.1", "transformers==4.51.3", "numpy==2.2.6", "pandas==2.2.3", "pyarrow==20.0.0", "pydantic==2.11.5", "fastapi==0.115.12", "uvicorn==0.34.2", "scipy==1.15.3", "scikit-learn==1.6.1", "matplotlib==3.10.3", "psutil==7.0.0", "dulwich==0.22.8"]

[project.scripts]
decisionos-sre = "decisionos_sre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
